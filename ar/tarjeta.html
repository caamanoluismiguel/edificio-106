<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta AR · Edificio 106</title>
<!-- Generador de la tarjeta. No es para el público: lo abre ar/generar-tarjeta.mjs.
     ?paso=plano  dibuja el plano del sitio desde arriba, a 300 ppp y a escala 1:300, y compila el archivo de rastreo.
     ?paso=hoja   arma la hoja A4 apaisada para imprimir. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  @page { size: 297mm 210mm; margin: 0; }
  html, body { margin: 0; background: #fff; color: #1d1d1b; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .hoja { position: relative; width: 297mm; height: 210mm; overflow: hidden; }
  .plano { position: absolute; left: 10mm; top: 10mm; width: 277mm; height: 160mm; display: block; }
  .pie { position: absolute; left: 10mm; right: 10mm; top: 175mm; height: 27mm; display: flex; align-items: center; gap: 8mm; }
  .qr { width: 27mm; height: 27mm; flex: none; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .texto { flex: 1; }
  .texto h1 { font-size: 13pt; margin: 0 0 1.5mm; font-weight: 700; }
  .texto p { font-size: 10pt; margin: 0; line-height: 1.35; }
  .texto .chico { font-size: 7.5pt; color: #555; margin-top: 1.5mm; }
  .escala { flex: none; font-size: 7.5pt; text-align: center; }
  .escala .barra { display: flex; height: 2mm; border: 0.3mm solid #1d1d1b; margin-bottom: 1mm; }
  .escala .barra i { width: 6.667mm; }
  .escala .barra i:nth-child(odd) { background: #1d1d1b; }
  .norte { flex: none; width: 16mm; text-align: center; font-size: 8pt; font-weight: 700; }
  .norte svg { width: 11mm; height: 11mm; display: block; margin: 0 auto 0.5mm; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { ESCALA, PLANO_MM, PLANO_M, CENTRO, EDIFICIO, cargar, nortePapel } from './escena-ar.js';

const paso = new URLSearchParams(location.search).get('paso');

if (paso === 'plano') {
  // 300 ppp: 277 × 160 mm → 3272 × 1890 px
  const W = Math.round(PLANO_MM[0] / 25.4 * 300), H = Math.round(PLANO_MM[1] / 25.4 * 300);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
  const [w, h] = PLANO_M, [cx, cz] = CENTRO;
  const cam = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 1, 400);
  cam.position.set(cx, 200, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz);
  // luz pareja desde arriba, sin sombras: la sombra la pone la AR, en vivo, y una impresa la contradiría
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 2.2));
  const d = new THREE.DirectionalLight(0xffffff, 1.4); d.position.set(-0.3, 1, 0.4); scene.add(d);
  const [sitio, edificio] = await Promise.all([
    cargar('../modelo', ['sitio', 'vegetacion', 'contexto'], { sombras: false }),
    cargar('./modelo', EDIFICIO, { sombras: false }),   // las tejas livianas: su variación da los puntos que MindAR necesita (ver generar-tarjeta.mjs)
  ]);
  scene.add(sitio, edificio);
  renderer.render(scene, cam);
  window.__plano = renderer.domElement.toDataURL('image/png');

  // archivo de rastreo: MindAR compila desde una copia de 1000 px de ancho (su tamaño recomendado)
  await import('./vendor/mindar/mindar-image.prod.js');
  const img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = window.__plano; });
  const chica = document.createElement('canvas'); chica.width = 1000; chica.height = Math.round(1000 * H / W);
  chica.getContext('2d').drawImage(img, 0, 0, chica.width, chica.height);
  const ref = new Image(); ref.src = chica.toDataURL('image/png'); await ref.decode();
  const compilador = new window.MINDAR.IMAGE.Compiler();
  const datos = await compilador.compileImageTargets([ref], p => { window.__progreso = p; });
  const buf = await compilador.exportData();
  window.__mind = btoa(Array.from(new Uint8Array(buf), b => String.fromCharCode(b)).join(''));
  window.__puntos = datos.map(t => ({ ancho: t.width, alto: t.height, niveles: t.matchingData?.length,
    puntos: t.matchingData?.reduce((s, m) => s + (m.maximaPoints?.length ?? 0) + (m.minimaPoints?.length ?? 0), 0) }));
  window.__listo = true;
}

if (paso === 'hoja') {
  const qr = await (await fetch('./tarjeta/qr.svg')).text();
  const giro = nortePapel();
  document.body.innerHTML = `
  <div class="hoja">
    <img class="plano" src="./tarjeta/plano.png" alt="">
    <div class="pie">
      <div class="qr">${qr}</div>
      <div class="texto">
        <h1>Edificio 106 · Isthmus · Ciudad del Saber</h1>
        <p>Escanea el código, permite la cámara y apunta el celular al plano entero. El edificio aparece encima, con el sol de verdad.</p>
        <p class="chico">Imprime en papel mate, sin ajustar a la página (100 %). La tarjeta tiene que verse completa y plana.</p>
      </div>
      <div class="escala"><div class="barra"><i></i><i></i><i></i><i></i><i></i></div>0 · 10 m · Escala 1:${ESCALA}</div>
      <div class="norte"><svg viewBox="-10 -10 20 20"><g transform="rotate(${giro.toFixed(1)})"><path d="M0 -9 L5 7 L0 4 L-5 7 Z" fill="#1d1d1b"/></g></svg>N</div>
    </div>
  </div>`;
  await Promise.all([...document.images].map(i => i.decode()));
  window.__listo = true;
}
</script>
</body>
</html>
